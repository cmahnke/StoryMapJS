<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>StoryMapJS Example Harness</title>
        <style>
            * {
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
            }
            #storymap-embed {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="storymap-embed"></div>
        <script type="module">
            import { StoryMap } from "./src/main.ts";

            window.__smErrors = [];
            window.__smReady = false;
            window.addEventListener("error", (e) => {
                window.__smErrors.push(String(e.message || e));
            });

            const params = new URLSearchParams(window.location.search);
            const manifest = params.get("manifest");
            const name = manifest !== null ? manifest : params.get("example");
            const base = manifest !== null ? "/examples-iiif/" : "/examples/";
            // optional inline options overrides for issue-reproduction tests
            let optionsOverride = {};
            if (params.get("options")) {
                try {
                    optionsOverride = JSON.parse(params.get("options"));
                } catch (e) {
                    window.__smErrors.push("harness: bad options param: " + e);
                }
            }

            fetch(base + name + ".json")
                .then((r) => {
                    return r.json();
                })
                .then((data) => {
                    window.__sm = new StoryMap("storymap-embed", data, optionsOverride, {});
                    window.__smReady = true;
                })
                .catch((err) => {
                    window.__smErrors.push(
                        "harness: " + (err && err.message ? err.message : String(err)),
                    );
                    window.__smReady = true;
                });
        </script>
    </body>
</html>
