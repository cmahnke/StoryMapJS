<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>StoryMapJS Example Harness</title>
        <style>
            * {
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
            }
            #storymap-embed {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="storymap-embed"></div>
        <script type="module">
            import { StoryMap } from "./src/main.ts";
            import { recordEvents, tileFactoryFrom } from "./harness-support.js";

            window.__smErrors = [];
            window.__smReady = false;
            window.addEventListener("error", (e) => {
                window.__smErrors.push(String(e.message || e));
            });

            const params = new URLSearchParams(window.location.search);
            const manifest = params.get("manifest");
            const slideshow = params.get("slideshow");
            const remoteUrl = params.get("url");
            const name =
                manifest !== null
                    ? manifest
                    : slideshow !== null
                      ? slideshow
                      : params.get("example");
            const base =
                manifest !== null
                    ? "/examples-iiif/"
                    : slideshow !== null
                      ? "/examples-slideshow/"
                      : "/examples/";
            // optional inline options overrides for issue-reproduction tests
            let optionsOverride = {};
            if (params.get("options")) {
                try {
                    optionsOverride = JSON.parse(params.get("options"));
                } catch (e) {
                    window.__smErrors.push("harness: bad options param: " + e);
                }
            }
            // a tile source is a function, so it cannot ride in the JSON options
            // param: tests define window.__tileSourceFactory in an init script
            const factory = tileFactoryFrom(window);
            if (factory) {
                optionsOverride.tile_source_factory = factory;
            }

            const dataUrl = remoteUrl ?? base + name + ".json";

            fetch(dataUrl)
                .then((r) => {
                    return r.json();
                })
                .then((data) => {
                    // slideshow tours pass the URL through so the viewer
                    // exercises its own fetch + next-page following (like a
                    // host would); everything else passes the document
                    const sm = new StoryMap(
                        "storymap-embed",
                        slideshow !== null && remoteUrl === null ? dataUrl : data,
                        optionsOverride,
                        {
                            // viewer load failures (bad URL, bad document)
                            // only reach console.error + this event — without
                            // this bridge the specs' __smErrors stays empty
                            // while nothing renders
                            error: (e) => {
                                window.__smErrors.push("storymap: " + (e.message || String(e)));
                            },
                        },
                    );
                    window.__sm = sm;
                    // opt-in: ?record=imageready,loaded collects events into
                    // window.__events. Attaching here (not in the constructor
                    // options) is why the listener map exists at all.
                    recordEvents(sm, params.get("record"), window);
                    window.__smReady = true;
                })
                .catch((err) => {
                    window.__smErrors.push(
                        "harness: " + (err && err.message ? err.message : String(err)),
                    );
                    window.__smReady = true;
                });
        </script>
    </body>
</html>
