name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint (eslint + stylelint)
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Check locale coverage
              run: npm run check:locales:strict

            - name: Validate storymap fixtures
              run: npm run validate

            - name: Validate IIIF manifests
              run: npm run validate:iiif

            - name: Unit tests (vitest)
              run: npm test

            - name: Build
              run: npm run build

            - name: Verify build outputs
              run: |
                  test -f dist/js/storymap.js
                  test -f dist/js/storymap.js.map
                  test -f dist/js/storymap.d.ts
                  test -f dist/css/storymap.css
                  test -f dist/index.html
                  test -f dist/demo.html
                  test -f dist/harness.html
                  test -f dist/harness-multi.html
                  test -f dist/embed/index.html

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: E2E tests (playwright)
              run: npm run test:e2e

    e2e-matrix:
        # One leg per engine. Deliberately NOT blocking: the suite has never
        # run on anything but Chromium, so this surfaces pre-existing
        # engine-specific failures that have nothing to do with the change
        # under review. Flip `continue-on-error` to false once the known ones
        # are fixed and the legs stay green.
        # fail-fast is off on purpose: a chromium failure must not cancel the
        # firefox/webkit legs, whose comparison is the point of the job.
        runs-on: ubuntu-latest
        continue-on-error: true
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
        name: e2e-matrix (${{ matrix.browser }})
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browser
              run: npx playwright install --with-deps ${{ matrix.browser }}

            # E2E_ALL_BROWSERS=1 is what defines the firefox/webkit projects
            # in playwright.config.ts; --project then selects this leg's
            # engine instead of running all three in every leg.
            - name: E2E tests (${{ matrix.browser }})
              run: E2E_ALL_BROWSERS=1 npx playwright test --project=${{ matrix.browser }}
