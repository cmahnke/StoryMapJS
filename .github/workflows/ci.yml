name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint (eslint + stylelint)
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Validate storymap fixtures
              run: npm run validate

            - name: Validate IIIF manifests
              run: npm run validate:iiif

            - name: Unit tests (vitest)
              run: npm test

            - name: Build
              run: npm run build

            - name: Verify build outputs
              run: |
                  test -f dist/js/storymap.js
                  test -f dist/js/storymap.js.map
                  test -f dist/js/storymap.d.ts
                  test -f dist/css/storymap.css
                  test -f dist/index.html
                  test -f dist/demo.html
                  test -f dist/harness.html
                  test -f dist/embed/index.html

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: E2E tests (playwright)
              run: npm run test:e2e
