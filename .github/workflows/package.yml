name: Package

on:
    push:
        tags: ["v*"]

jobs:
    package:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Zip dist
              run: |
                  cd dist
                  zip -r ../storymapjs-${{ github.ref_name }}.zip .

            - name: Attach to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: storymapjs-${{ github.ref_name }}.zip
                  generate_release_notes: true
