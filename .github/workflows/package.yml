name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

jobs:
    package:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Zip dist
              run: |
                  cd dist
                  zip -r ../storymapjs-${{ github.ref_name }}.zip .

            - name: Attach to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: storymapjs-${{ github.ref_name }}.zip
                  generate_release_notes: true

    publish-npm:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version-file: ".nvmrc"
                registry-url: "https://registry.npmjs.org"
            - run: npm i
            - run: npm run build
            - run: npm publish --provenance --access public
              env:
                NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    publish-gpr:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: "https://npm.pkg.github.com"
                  scope: "@cmahnke"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Rename scope for GitHub Packages (must match the owner)
              run: |
                  node -e "
                      const fs = require('fs');
                      const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                      p.name = '@cmahnke/storymapjs';
                      fs.writeFileSync('package.json', JSON.stringify(p, null, 4) + '\n');
                  "

            - name: Publish to GitHub Packages (@cmahnke/storymapjs)
              run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
