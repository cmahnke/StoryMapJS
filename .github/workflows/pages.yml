name: GitHub Pages

on:
    push:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: API docs
              # TypeDoc output (public/docs/api) is not part of `npm run
              # build`, so generate it here before packaging dist/ — the
              # site nav links to docs/api/index.html.
              run: npm run docs:api && cp -r public/docs/api dist/docs/api

            - name: Prepare Pages output
              run: touch dist/.nojekyll

            - name: Deploy to gh-pages branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: gh-pages
                  publish_dir: dist
                  force_orphan: true
