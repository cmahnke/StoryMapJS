<!DOCTYPE html>
<html lang="en">
<head>
  <title>StoryMapJS Embed</title>
  <meta charset="utf-8">
  <meta name="description" content="StoryMapJS Embed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="../css/storymap.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
    }
  </style>
</head>

<body>
  <div id="storymap-embed"></div>

  <script type="module">
    import { StoryMap } from "../js/storymap.js";

    let storymap;
    const urlParams = new URLSearchParams(window.location.search);

    function onStoryMapTitle(e) {
      document.title = "StoryMapJS: " + e.title;
    }

    function getStartSlide() {
      var slide = 0;
      if (urlParams.has('start_at_slide')) {
        slide = parseInt(urlParams.get('start_at_slide'), 10);
      }
      return slide;
    }

    function buildStoryMap(data) {
        if (!data || !data.storymap) { return; }
        const options = {
            start_at_slide: getStartSlide()
        };
        // font theme loading is handled by the library (data.font_css / stock:default)
        storymap = new StoryMap('storymap-embed', data, options, {
            title: onStoryMapTitle
        });
    }

    (function() {
        let storymap_url = urlParams.get('url');
        // resolve the url parameter against the SITE ROOT (the directory
        // containing embed/), not against embed/ — works with relative
        // ("examples/katrina.json"), root-relative ("/examples/…") and full
        // URLs, in dev, preview and GitHub Pages project subpaths
        const siteRoot = new URL('..', window.location.href);
        storymap_url = new URL(storymap_url, siteRoot).href;
        fetch(storymap_url)
            .then(response => response.json())
            .then(data => buildStoryMap(data));
    })();
  </script>
</body>
</html>
