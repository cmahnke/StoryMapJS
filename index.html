<!doctype html>
<html lang="en">
    <head>
        <title>StoryMapJS Demo</title>
        <meta charset="utf-8" />
        <style>
            * {
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
            }
            #storymap-embed {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>

    <body>
        <div id="storymap-embed"></div>

        <script type="module">
            import { StoryMap } from "./src/main.ts";

            function onStoryMapTitle(e) {
                document.title = "StoryMapJS: " + e.title;
            }

            fetch("./football.json")
                .then((response) => response.json())
                .then((data) => {
                    window.storymap = new StoryMap(
                        "storymap-embed",
                        data,
                        {},
                        { title: onStoryMapTitle },
                    );
                })
                .catch((error) => {
                    console.error("Error loading storymap data:", error);
                    document.getElementById("storymap-embed").innerHTML =
                        '<p style="color: red; padding: 20px;">Error loading storymap data. Check console for details.</p>';
                });
        </script>
    </body>
</html>
