<!doctype html>
<html lang="en">
    <head>
        <title>StoryMapJS Demo</title>
        <meta charset="utf-8" />
        <style>
            * {
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
            }
            #storymap-embed {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>

    <body>
        <div id="storymap-embed"></div>

        <script type="module">
            import { StoryMap } from "./src/main.ts";

            function onStoryMapTitle(e) {
                document.title = "StoryMapJS: " + e.title;
            }

            // The constructor accepts a source file URL directly; it fetches
            // the storymap JSON (or an IIIF manifest) and validates it.
            // The demo story is the Knight Lab homepage's "US Westward
            // Expansion" (self-hosted from storymap.knightlab.com's demo).
            window.storymap = new StoryMap(
                "storymap-embed",
                "./demo.json",
                {},
                {
                    title: onStoryMapTitle,
                },
            );
        </script>
    </body>
</html>
