<!doctype html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>StoryMapJS basic example</title>
        <link rel="stylesheet" href="../../dist/css/storymap.css" />
    </head>
    <body>
        <div id="mapdiv" style="width: 100%; height: 600px"></div>

        <script type="module">
            // The fork ships an ES module only (no KLStoryMap global). The
            // relative paths assume the repository root is served statically
            // and `npm run build` has produced dist/.
            import { StoryMap } from "../../dist/js/storymap.js";

            const storymap_url = "../../public/examples/katrina.json";
            const storymap_options = {};

            const storymap = new StoryMap("mapdiv", storymap_url, storymap_options);

            window.onresize = () => {
                storymap.updateDisplay();
            };

            // expose for the e2e tests
            window.storymap = storymap;
        </script>
    </body>
</html>
