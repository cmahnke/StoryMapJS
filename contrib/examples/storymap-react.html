<!doctype html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>StoryMapJS React example</title>
        <link rel="stylesheet" href="../../dist/css/storymap.css" />
    </head>
    <body>
        <div id="root"></div>

        <script type="module">
            // The fork ships an ES module only (no KLStoryMap global). The
            // relative paths assume the repository root is served statically
            // and `npm run build` has produced dist/. React is loaded from
            // esm.sh so the example stays dependency-free.
            import { StoryMap } from "../../dist/js/storymap.js";
            import React from "https://esm.sh/react@18";
            import { createRoot } from "https://esm.sh/react-dom@18/client";

            const storymap_url = "../../public/examples/katrina.json";
            const storymap_options = {};

            function App() {
                const ref = React.useRef(null);

                React.useEffect(() => {
                    const storymap = new StoryMap(ref.current, storymap_url, storymap_options);
                    window.storymap = storymap;
                    const onResize = () => storymap.updateDisplay();
                    window.addEventListener("resize", onResize);
                    return () => window.removeEventListener("resize", onResize);
                }, []);

                return React.createElement("div", {
                    ref: ref,
                    style: { width: "100%", height: "600px" },
                });
            }

            createRoot(document.getElementById("root")).render(React.createElement(App));
        </script>
    </body>
</html>
